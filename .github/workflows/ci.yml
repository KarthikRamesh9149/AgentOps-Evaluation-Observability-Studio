name: local-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: local
      ALLOW_INSECURE_LOCAL_DEMO: "true"
      DATA_DIR: ../data
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: cd backend && python -m pip install -e ".[dev]"
      - name: Backend lint
        run: cd backend && python -m ruff check app tests
      - name: Backend typecheck
        run: cd backend && python -m mypy app
      - name: Backend tests
        run: cd backend && python -m pytest
      - name: Install frontend
        run: cd frontend && npm ci
      - name: Install Playwright browser
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Frontend typecheck
        run: cd frontend && npm run typecheck
      - name: Frontend build
        run: cd frontend && npm run build
      - name: Frontend e2e
        run: |
          cd backend
          python -m app.cli.main seed-demo
          python -m app.cli.main run-evals
          cd ../frontend
          npm run e2e
      - name: Seed demo and run mock evals
        run: |
          cd backend
          python -m app.cli.main seed-demo
          python -m app.cli.main run-evals
          python -m app.cli.main apply-quality-gate
