name: local-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATA_DIR: ../data
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: cd backend && python -m pip install -e ".[dev]"
      - name: Backend lint
        run: cd backend && python -m ruff check app tests
      - name: Backend typecheck
        run: cd backend && python -m mypy app
      - name: Backend tests
        run: cd backend && python -m pytest
      - name: Install frontend
        run: cd frontend && npm ci
      - name: Install Playwright browser
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Frontend typecheck
        run: cd frontend && npm run typecheck
      - name: Frontend build
        run: cd frontend && npm run build
      - name: Frontend e2e
        run: |
          cd backend
          python -m app.cli.main seed-demo
          python -m app.cli.main run-evals
          cd ../frontend
          npm run e2e
      - name: Seed demo and run mock evals
        run: |
          cd backend
          python -m app.cli.main seed-demo
          python -m app.cli.main run-evals
          python -m app.cli.main apply-quality-gate
